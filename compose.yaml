services:
  api:
    build: .
    # Retrieval settings (mode, reranker, top_k, gates) are the dev-tuned defaults in
    # Settings; override them here only after re-tuning on dev.
    environment:
      OPENUSD_QDRANT_URL: http://qdrant:6333
      # Not OPENUSD_OLLAMA_URL: Compose reads .env, where that points at 127.0.0.1 for local
      # runs, and inside the container 127.0.0.1 is the container itself.
      OPENUSD_OLLAMA_URL: ${OPENUSD_DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
      OPENUSD_CHAT_MODEL: ${OPENUSD_CHAT_MODEL:-qwen3.5:9b}
      OPENUSD_EMBEDDING_MODEL: ${OPENUSD_EMBEDDING_MODEL:-nomic-embed-text:v1.5}
      OPENUSD_EMBEDDING_REVISION: ${OPENUSD_EMBEDDING_REVISION:-}
      OPENUSD_CHAT_PROVIDER: ${OPENUSD_CHAT_PROVIDER:-ollama}
      OPENUSD_GEMINI_MODEL: ${OPENUSD_GEMINI_MODEL:-}
      OPENUSD_GEMINI_API_KEY: ${OPENUSD_GEMINI_API_KEY:-}
      OPENUSD_RERANKER_CACHE: /home/appuser/fastembed
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # The reranker model is downloaded on first use; keep it across restarts.
      - fastembed:/home/appuser/fastembed
    depends_on:
      - qdrant
  qdrant:
    image: qdrant/qdrant:v1.20.2
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  qdrant-data:
  fastembed:
